<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyStock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h1>EasyStock</h1>

    <a href="/cadastrar" class="btn btn-success mb-3">
        Novo Produto
    </a>

    <table class="table table-bordered">

        <thead>

            <tr>
                <th>Nome</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>

        </thead>

        <tbody>

        {% for produto in produtos %}

        <tr>

            <td>{{ produto.nome }}</td>

            <td>R$ {{ produto.preco }}</td>

            <td>{{ produto.quantidade }}</td>

            <td>

                <a href="/editar/{{ produto.id }}" class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="/excluir/{{ produto.id }}" class="btn btn-danger btn-sm">
                    Excluir
                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</body>
</html>
